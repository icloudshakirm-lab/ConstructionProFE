<p-dialog
  [header]="row()?.name ?? 'Item'"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading…</p>
  } @else if (row(); as r) {
    <div class="erp-dialog__summary">
      <p class="erp-doc__subtitle">{{ r.title }}</p>
      <div class="cp-data-grid__row-actions">
        <p-button label="Edit" icon="pi pi-pencil" size="small" [outlined]="true" (onClick)="openEdit()" />
        <p-button
          label="Delete"
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          size="small"
          [loading]="deleting()"
          (onClick)="remove()"
        />
      </div>
    </div>
    <dl class="erp-dialog__detail-grid">
      <div>
        <dt>Barcode</dt>
        <dd style="font-family: ui-monospace, monospace">{{ r.barcode || '—' }}</dd>
      </div>
      <div>
        <dt>Item group</dt>
        <dd>{{ groupName() ?? '—' }}</dd>
      </div>
      <div>
        <dt>Description</dt>
        <dd>{{ r.description || '—' }}</dd>
      </div>
    </dl>
  }
</p-dialog>

<app-item-form-dialog
  [visible]="formVisible()"
  (visibleChange)="onFormVisibleChange($event)"
  [itemId]="row()?.id ?? null"
  formIdSuffix="view"
  (saved)="onFormSaved()"
/>
