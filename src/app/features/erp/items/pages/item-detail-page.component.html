<div class="space-y-4">
  <a routerLink="/app/items" class="text-sm text-[var(--p-primary-color)] no-underline">← Back to list</a>

  @if (error()) {
    <p class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200">
      {{ error() }}
    </p>
  }

  @if (loading()) {
    <p class="text-sm text-slate-500">Loading…</p>
  } @else if (row(); as r) {
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-semibold text-slate-900 dark:text-slate-50">{{ r.name }}</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400">{{ r.title }}</p>
      </div>
      <button
        type="button"
        class="rounded-lg border border-red-200 px-3 py-2 text-sm font-medium text-red-700 dark:border-red-900 dark:text-red-400"
        [disabled]="deleting()"
        (click)="remove()"
      >
        {{ deleting() ? 'Deleting…' : 'Delete' }}
      </button>
    </div>
    <dl class="grid max-w-xl gap-3 text-sm">
      <div>
        <dt class="font-medium text-slate-500 dark:text-slate-400">Barcode</dt>
        <dd class="font-mono text-slate-800 dark:text-slate-100">{{ r.barcode }}</dd>
      </div>
      <div>
        <dt class="font-medium text-slate-500 dark:text-slate-400">Item group id</dt>
        <dd class="text-slate-800 dark:text-slate-100">{{ r.itemGroupId || '—' }}</dd>
      </div>
      <div>
        <dt class="font-medium text-slate-500 dark:text-slate-400">Description</dt>
        <dd class="text-slate-800 dark:text-slate-100">{{ r.description || '—' }}</dd>
      </div>
    </dl>
  }
</div>
