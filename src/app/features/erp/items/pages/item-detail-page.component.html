<div class="erp-doc">
  <div class="erp-doc__header">
    <div>
      <p-button label="Back to list" icon="pi pi-arrow-left" [text]="true" routerLink="/erp/items" />
    </div>
  </div>

  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading…</p>
  } @else if (row(); as r) {
    <div class="erp-doc__section">
      <div class="erp-doc__section-head">
        <div>
          <h3>{{ r.name }}</h3>
          <p>{{ r.title }}</p>
        </div>
        <p-button
          label="Delete"
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          [loading]="deleting()"
          (onClick)="remove()"
        />
      </div>
      <dl class="erp-dialog__detail-grid">
        <div>
          <dt>Barcode</dt>
          <dd style="font-family: ui-monospace, monospace">{{ r.barcode || '—' }}</dd>
        </div>
        <div>
          <dt>Item group id</dt>
          <dd>{{ r.itemGroupId || '—' }}</dd>
        </div>
        <div>
          <dt>Description</dt>
          <dd>{{ r.description || '—' }}</dd>
        </div>
      </dl>
    </div>
  }
</div>
