<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="Item Master · Items" severity="info" />
      <h1>Items</h1>
      <p class="erp-list-page__subtitle">Stock and product catalog — each item can belong to an item group.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New item" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-item-form-dialog
    formIdSuffix="list"
    [visible]="formVisible()"
    (visibleChange)="onFormVisibleChange($event)"
    (saved)="load()"
  />

  <app-item-view-dialog
    [visible]="viewVisible()"
    (visibleChange)="onViewVisibleChange($event)"
    [itemId]="viewItemId()"
    (saved)="onViewSaved()"
  />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading items…</p>
  } @else {
    <p-table
      [value]="rows()"
      [rows]="10"
      [paginator]="rows().length > 10"
      dataKey="id"
      styleClass="cp-data-grid"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Title</th>
          <th>Barcode</th>
          <th>Group</th>
          <th style="width: 7rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><strong>{{ row.name }}</strong></td>
          <td>{{ row.title }}</td>
          <td>{{ row.barcode || '—' }}</td>
          <td>{{ groupName(row.itemGroupId) }}</td>
          <td>
            <div class="cp-data-grid__row-actions">
              <p-button icon="pi pi-eye" [rounded]="true" [text]="true" title="View" (onClick)="openView(row.id)" />
              <p-button
                icon="pi pi-external-link"
                [rounded]="true"
                [text]="true"
                title="Detail page"
                [routerLink]="['/erp/items', row.id]"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="cp-data-grid__empty">No items yet.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
