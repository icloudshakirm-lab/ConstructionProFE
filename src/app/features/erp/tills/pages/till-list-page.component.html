<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="POS Setup" severity="info" />
      <h1>Tills</h1>
      <p class="erp-list-page__subtitle">Manage POS tills, warehouses, and active status.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New till" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-till-form-dialog
    [visible]="formVisible()"
    (visibleChange)="onFormVisibleChange($event)"
    [tillId]="formTillId()"
    (saved)="load()"
  />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading tills…</p>
  } @else {
    <p-table
      [value]="rows()"
      [rows]="10"
      [paginator]="rows().length > 10"
      dataKey="id"
      styleClass="cp-data-grid"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Warehouse</th>
          <th>Status</th>
          <th style="width: 5rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><strong>{{ row.code }}</strong></td>
          <td>{{ row.name }}</td>
          <td>#{{ row.warehouseId }}</td>
          <td>
            <p-tag [value]="row.isActive ? 'Active' : 'Inactive'" [severity]="row.isActive ? 'success' : 'secondary'" />
          </td>
          <td>
            <div class="cp-data-grid__row-actions">
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" title="Edit" (onClick)="openEdit(row.id)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="cp-data-grid__empty">No tills yet.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
