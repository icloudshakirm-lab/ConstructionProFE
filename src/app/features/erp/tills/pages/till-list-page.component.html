<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="POS Setup" severity="info" />
      <h1>Tills</h1>
      <p class="erp-list-page__subtitle">Manage POS tills, warehouses, and active status.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New till" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-till-form-dialog
    [visible]="formVisible()"
    (visibleChange)="onFormVisibleChange($event)"
    [tillId]="formTillId()"
    (saved)="load()"
  />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading tills…</p>
  } @else if (rows().length === 0) {
    <div class="erp-list-page__empty-panel">
      <i class="pi pi-calculator" style="font-size: 2rem; margin-bottom: 0.5rem; display: block"></i>
      No tills yet. Click <strong>New till</strong> to create one.
    </div>
  } @else {
    <div class="erp-entity-cards">
      @for (till of rows(); track till.id) {
        <button type="button" class="erp-entity-cards__card" (click)="openEdit(till.id)">
          <div class="erp-entity-cards__row">
            <div class="erp-entity-cards__icon"><i class="pi pi-calculator"></i></div>
            <div class="erp-entity-cards__main">
              <div class="erp-entity-cards__title-row">
                <span class="erp-entity-cards__title">{{ till.name }}</span>
                <p-tag
                  [value]="till.isActive ? 'Active' : 'Inactive'"
                  [severity]="till.isActive ? 'success' : 'secondary'"
                />
              </div>
              <div class="erp-entity-cards__meta">
                <span><strong>Code</strong>{{ till.code }}</span>
                <span><strong>Warehouse</strong>#{{ till.warehouseId }}</span>
              </div>
              @if (till.description) {
                <p class="erp-entity-cards__desc">{{ till.description }}</p>
              }
            </div>
          </div>
        </button>
      }
    </div>
  }
</div>
