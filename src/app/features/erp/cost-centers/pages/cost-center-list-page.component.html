<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="Account Master · Cost" severity="info" />
      <h1>Cost centers</h1>
      <p class="erp-list-page__subtitle">Define cost centers for allocation and reporting.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New cost center" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-cost-center-form-dialog
    [visible]="formVisible()"
    [costCenterId]="null"
    (visibleChange)="onFormVisibleChange($event)"
    (saved)="load()"
  />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading cost centers…</p>
  } @else {
    <p-table
      [value]="rows()"
      [rows]="10"
      [paginator]="rows().length > 10"
      dataKey="id"
      styleClass="cp-data-grid"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th style="width: 6rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><strong>{{ row.code }}</strong></td>
          <td>{{ row.name }}</td>
          <td>
            <div class="cp-data-grid__row-actions">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                title="View"
                [routerLink]="['/erp/cost-centers', row.id]"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="3" class="cp-data-grid__empty">No cost centers yet.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
