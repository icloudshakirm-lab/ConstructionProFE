<p-dialog
  header="New exchange rate"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  <form class="erp-dialog__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__field">
      <label for="cer-from" class="erp-doc__label">From currency</label>
      <p-select
        inputId="cer-from"
        formControlName="fromCurrencyId"
        [options]="currencyOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select currency"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="erp-doc__field">
      <label for="cer-to" class="erp-doc__label">To currency</label>
      <p-select
        inputId="cer-to"
        formControlName="toCurrencyId"
        [options]="currencyOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select currency"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="erp-doc__field">
      <label for="cer-rate" class="erp-doc__label">Rate</label>
      <input id="cer-rate" type="number" step="any" formControlName="rate" class="erp-doc__input erp-doc__input--amount" />
    </div>
    <div class="erp-doc__field">
      <label for="cer-eff" class="erp-doc__label">Effective date (optional)</label>
      <input id="cer-eff" type="datetime-local" formControlName="effectiveDate" class="erp-doc__input" />
    </div>
    <div class="erp-dialog__actions">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button type="button" label="Save rate" icon="pi pi-check" [loading]="saving()" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
