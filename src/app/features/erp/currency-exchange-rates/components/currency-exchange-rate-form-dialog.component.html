<p-dialog
  header="New exchange rate"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200">
      {{ error() }}
    </p>
  }

  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="flex flex-col gap-1.5">
      <label for="cer-from" class="text-sm font-medium text-slate-700 dark:text-slate-300">From currency</label>
      <p-select
        inputId="cer-from"
        formControlName="fromCurrencyId"
        [options]="currencyOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select"
        [appendTo]="'body'"
        styleClass="w-full"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="cer-to" class="text-sm font-medium text-slate-700 dark:text-slate-300">To currency</label>
      <p-select
        inputId="cer-to"
        formControlName="toCurrencyId"
        [options]="currencyOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select"
        [appendTo]="'body'"
        styleClass="w-full"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="cer-rate" class="text-sm font-medium text-slate-700 dark:text-slate-300">Rate</label>
      <input
        id="cer-rate"
        type="number"
        step="any"
        formControlName="rate"
        class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="cer-eff" class="text-sm font-medium text-slate-700 dark:text-slate-300">Effective date (optional)</label>
      <input
        id="cer-eff"
        type="datetime-local"
        formControlName="effectiveDate"
        class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
      />
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 pt-4 dark:border-slate-700">
      <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" />
      <p-button type="button" label="Save" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
