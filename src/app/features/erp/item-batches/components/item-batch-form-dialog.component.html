<p-dialog
  header="New item batch"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  <form class="erp-dialog__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__field">
      <label for="ibd-item" class="erp-doc__label">Item</label>
      <p-select
        inputId="ibd-item"
        formControlName="itemId"
        [options]="itemOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select item"
        [filter]="true"
        filterBy="label"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="erp-doc__field">
      <label for="ibd-num" class="erp-doc__label">Batch number</label>
      <input id="ibd-num" type="text" formControlName="batchNumber" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="ibd-mfg" class="erp-doc__label">Manufacturing date</label>
      <input id="ibd-mfg" type="datetime-local" formControlName="manufacturingDate" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="ibd-exp" class="erp-doc__label">Expiry (optional)</label>
      <input id="ibd-exp" type="datetime-local" formControlName="expiryDate" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="ibd-price" class="erp-doc__label">Default price</label>
      <input id="ibd-price" type="number" step="0.01" min="0" formControlName="defaultPrice" class="erp-doc__input erp-doc__input--amount" />
    </div>
    <div class="erp-doc__field">
      <label for="ibd-notes" class="erp-doc__label">Notes</label>
      <textarea id="ibd-notes" rows="2" formControlName="notes" class="erp-doc__input"></textarea>
    </div>
    <div class="erp-dialog__actions">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button type="button" label="Create" icon="pi pi-check" [loading]="saving()" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
