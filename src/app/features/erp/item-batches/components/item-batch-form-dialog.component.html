<p-dialog
  header="New item batch"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [style]="{ width: 'min(calc(100vw - 2rem), 26rem)' }"
>
  @if (error()) {
    <p class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200">
      {{ error() }}
    </p>
  }

  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="flex flex-col gap-1.5">
      <label for="ibd-item" class="text-sm font-medium text-slate-700 dark:text-slate-300">Item</label>
      <p-select
        inputId="ibd-item"
        formControlName="itemId"
        [options]="itemOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select item"
        [filter]="true"
        filterBy="label"
        [appendTo]="'body'"
        styleClass="w-full"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="ibd-num" class="text-sm font-medium text-slate-700 dark:text-slate-300">Batch number</label>
      <input id="ibd-num" type="text" formControlName="batchNumber" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="ibd-mfg" class="text-sm font-medium text-slate-700 dark:text-slate-300">Manufacturing date</label>
      <input id="ibd-mfg" type="datetime-local" formControlName="manufacturingDate" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="ibd-exp" class="text-sm font-medium text-slate-700 dark:text-slate-300">Expiry (optional)</label>
      <input id="ibd-exp" type="datetime-local" formControlName="expiryDate" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="ibd-price" class="text-sm font-medium text-slate-700 dark:text-slate-300">Default price</label>
      <input id="ibd-price" type="number" step="0.01" min="0" formControlName="defaultPrice" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="ibd-notes" class="text-sm font-medium text-slate-700 dark:text-slate-300">Notes</label>
      <textarea id="ibd-notes" rows="2" formControlName="notes" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"></textarea>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 pt-4 dark:border-slate-700">
      <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" />
      <p-button type="button" label="Create" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
