<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="Account Master · Ledgers" severity="info" />
      <h1>Ledgers</h1>
      <p class="erp-list-page__subtitle">Create, view, edit, and remove ledger accounts.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New ledger" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-ledger-form-dialog
    [visible]="formVisible()"
    (visibleChange)="onFormVisibleChange($event)"
    [ledgerId]="formLedgerId()"
    (saved)="load()"
  />

  <app-ledger-view-dialog
    [visible]="viewVisible()"
    (visibleChange)="onViewVisibleChange($event)"
    [ledgerId]="viewLedgerId()"
    (saved)="onViewSaved()"
  />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading ledgers…</p>
  } @else {
    <p-table
      [value]="rows()"
      [rows]="10"
      [paginator]="rows().length > 10"
      dataKey="id"
      styleClass="cp-data-grid"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Group</th>
          <th style="width: 7rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><strong>{{ row.code }}</strong></td>
          <td>{{ row.name }}</td>
          <td>{{ row.groupName ?? '—' }}</td>
          <td>
            <div class="cp-data-grid__row-actions">
              <p-button icon="pi pi-eye" [rounded]="true" [text]="true" title="View" (onClick)="openView(row.id)" />
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" title="Edit" (onClick)="openEdit(row.id)" />
              <p-button
                icon="pi pi-arrow-right"
                [rounded]="true"
                [text]="true"
                title="Open detail"
                [routerLink]="['/erp/ledgers', row.id]"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="cp-data-grid__empty">No ledgers yet.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
