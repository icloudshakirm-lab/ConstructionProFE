<p-dialog
  [header]="row()?.name ?? 'Ledger'"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading…</p>
  } @else if (row(); as r) {
    <div class="erp-dialog__summary">
      <p class="erp-dialog__rate"><strong>{{ r.code }}</strong></p>
      <div class="cp-data-grid__row-actions">
        <p-button label="Edit" icon="pi pi-pencil" severity="secondary" [outlined]="true" size="small" (onClick)="openEdit()" />
        <p-button label="Delete" icon="pi pi-trash" severity="danger" [outlined]="true" size="small" [loading]="deleting()" (onClick)="remove()" />
      </div>
    </div>

    <dl class="erp-dialog__detail-grid">
      <div>
        <dt>Description</dt>
        <dd>{{ r.description || '—' }}</dd>
      </div>
      <div>
        <dt>Group</dt>
        <dd>{{ r.groupName ?? '—' }}</dd>
      </div>
    </dl>
  }
</p-dialog>

<app-ledger-form-dialog
  [visible]="formVisible()"
  (visibleChange)="onFormVisibleChange($event)"
  [ledgerId]="row()?.id ?? null"
  (saved)="onFormSaved()"
/>
