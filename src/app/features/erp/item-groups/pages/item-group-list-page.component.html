<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="Item Master · Groups" severity="info" />
      <h1>Item groups</h1>
      <p class="erp-list-page__subtitle">Organize items into groups and hierarchies — create, view, and delete.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New group" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-item-group-form-dialog [visible]="formVisible()" (visibleChange)="onFormVisibleChange($event)" (saved)="load()" />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading item groups…</p>
  } @else {
    <p-table
      [value]="rows()"
      [rows]="10"
      [paginator]="rows().length > 10"
      dataKey="id"
      styleClass="cp-data-grid"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th style="width: 6rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><strong>{{ row.code }}</strong></td>
          <td>{{ row.name }}</td>
          <td>
            <div class="cp-data-grid__row-actions">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                title="View"
                [routerLink]="['/erp/item-groups', row.id]"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="3" class="cp-data-grid__empty">No item groups yet.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
