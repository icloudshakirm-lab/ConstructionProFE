<p-dialog
  header="New item group"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 26rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  <form class="erp-dialog__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__field">
      <label for="igd-code" class="erp-doc__label">Code</label>
      <input id="igd-code" type="text" formControlName="code" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="igd-name" class="erp-doc__label">Name</label>
      <input id="igd-name" type="text" formControlName="name" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="igd-desc" class="erp-doc__label">Description</label>
      <textarea id="igd-desc" rows="3" formControlName="description" class="erp-doc__input"></textarea>
    </div>
    <div class="erp-doc__field">
      <label for="igd-parent" class="erp-doc__label">Parent group</label>
      <p-select
        inputId="igd-parent"
        formControlName="parentGroupId"
        [options]="parentOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Optional"
        [showClear]="true"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="erp-dialog__actions">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button type="button" label="Create" icon="pi pi-check" [loading]="saving()" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
