<p-dialog
  header="Add to chart of accounts"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  <p class="mb-3 text-xs text-slate-500 dark:text-slate-400">
    Under group:
    <span class="font-medium text-slate-700 dark:text-slate-200">{{ parentLabel || '—' }}</span>
  </p>

  <p-tabs [value]="activeTab" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab value="ledger">Ledger</p-tab>
      <p-tab value="group">Group</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="ledger">
        @if (errorLedger()) {
          <p
            class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200"
          >
            {{ errorLedger() }}
          </p>
        }
        <form class="flex flex-col gap-3" [formGroup]="ledgerForm" (ngSubmit)="$event.preventDefault()">
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Code</label>
            <input
              type="text"
              formControlName="code"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Name</label>
            <input
              type="text"
              formControlName="name"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Description</label>
            <textarea
              rows="2"
              formControlName="description"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
            ></textarea>
          </div>
          <div class="flex justify-end gap-2 border-t border-slate-200 pt-3 dark:border-slate-700">
            <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" />
            <p-button
              type="button"
              label="Create ledger"
              [loading]="savingLedger()"
              (onClick)="submitLedger()"
            />
          </div>
        </form>
      </p-tabpanel>
      <p-tabpanel value="group">
        @if (errorGroup()) {
          <p
            class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200"
          >
            {{ errorGroup() }}
          </p>
        }
        <form class="flex flex-col gap-3" [formGroup]="groupForm" (ngSubmit)="$event.preventDefault()">
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Code</label>
            <input
              type="text"
              formControlName="code"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Name</label>
            <input
              type="text"
              formControlName="name"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Description</label>
            <textarea
              rows="2"
              formControlName="description"
              class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
            ></textarea>
          </div>
          <div class="flex justify-end gap-2 border-t border-slate-200 pt-3 dark:border-slate-700">
            <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" />
            <p-button
              type="button"
              label="Create group"
              [loading]="savingGroup()"
              (onClick)="submitGroup()"
            />
          </div>
        </form>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</p-dialog>
