<div class="p-6 space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Item Categories</h1>
      <p class="text-sm text-slate-500">Manage your inventory item categories and hierarchy.</p>
    </div>
    <p-button label="Add Category" icon="pi pi-plus" (click)="showAddDialog()"></p-button>
  </div>

  <div class="bg-white dark:bg-slate-900 shadow rounded-xl border border-slate-200 dark:border-slate-800">
    <p-table [value]="categories()" [loading]="loading()" [rows]="10" [paginator]="true" 
             styleClass="cp-data-grid" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-cat>
        <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
          <td class="font-mono text-xs font-bold text-slate-600 dark:text-slate-400">{{cat.code}}</td>
          <td>{{cat.name}}</td>
          <td class="text-slate-500 italic">{{cat.description || '—'}}</td>
          <td class="cp-data-grid__num">
            <p-button icon="pi pi-pencil" (click)="showEditDialog(cat)" 
                    variant="text" size="small" severity="info"></p-button>
            <p-button icon="pi pi-trash" (click)="delete(cat.id)" 
                    variant="text" size="small" severity="danger"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="cp-data-grid__empty">No categories found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [header]="editingCategory() ? 'Edit Category' : 'Add Category'" 
          [(visible)]="displayDialog" [modal]="true" [style]="{width: '450px'}" 
          [draggable]="false" [resizable]="false">
  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 pt-4">
    <div class="flex flex-col gap-2">
      <label for="code" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Code</label>
      <input id="code" pInputText formControlName="code" placeholder="e.g. ELEC" class="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="name" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Name</label>
      <input id="name" pInputText formControlName="name" placeholder="e.g. Electronics" class="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="description" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Description</label>
      <textarea id="description" pTextarea formControlName="description" rows="3" placeholder="Optional details..." class="w-full"></textarea>
    </div>

    <div class="flex flex-col gap-2">
      <label for="parent" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Parent Category</label>
      <p-select id="parent" formControlName="parentCategoryId" [options]="categories()" 
                optionLabel="name" optionValue="id" placeholder="None" 
                styleClass="w-full" [showClear]="true" appendTo="body"></p-select>
    </div>

    <div class="flex justify-end gap-3 pt-6 border-t border-slate-100 dark:border-slate-800">
      <p-button label="Cancel" icon="pi pi-times" variant="text" severity="secondary" (click)="displayDialog.set(false)"></p-button>
      <p-button type="submit" [label]="editingCategory() ? 'Update' : 'Save'" icon="pi pi-check" 
              [disabled]="form.invalid"></p-button>
    </div>
  </form>
</p-dialog>
