<div class="erp-list-page">
  <header class="erp-list-page__header">
    <div>
      <p-tag value="Account Master · FX" severity="info" />
      <h1>Currencies</h1>
      <p class="erp-list-page__subtitle">Manage currency codes, symbols, and decimal precision.</p>
    </div>
    <div class="erp-list-page__header-actions">
      <p-button label="New currency" icon="pi pi-plus" (onClick)="openNew()" />
    </div>
  </header>

  <app-currency-form-dialog
    [visible]="formVisible()"
    [currencyId]="null"
    (visibleChange)="onFormVisibleChange($event)"
    (saved)="load()"
  />

  @if (error()) {
    <p class="erp-list-page__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading currencies…</p>
  } @else {
    <p-table
      [value]="rows()"
      [rows]="10"
      [paginator]="rows().length > 10"
      dataKey="id"
      styleClass="cp-data-grid"
      [scrollable]="true"
      scrollHeight="flex"
    >
      <ng-template #header>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Symbol</th>
          <th class="erp-list-page__num">Decimals</th>
          <th style="width: 6rem">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><strong>{{ row.code }}</strong></td>
          <td>{{ row.name }}</td>
          <td>{{ row.symbol || '—' }}</td>
          <td class="erp-list-page__num">{{ row.decimalPlaces ?? '—' }}</td>
          <td>
            <div class="cp-data-grid__row-actions">
              <p-button
                icon="pi pi-eye"
                [rounded]="true"
                [text]="true"
                title="View"
                [routerLink]="['/erp/currencies', row.id]"
              />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="cp-data-grid__empty">No currencies yet.</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
