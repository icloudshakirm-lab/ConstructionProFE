<p-dialog
  [header]="header"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 26rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  <form class="erp-dialog__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__field">
      <label for="cur-code" class="erp-doc__label">Code</label>
      <input id="cur-code" type="text" formControlName="code" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="cur-name" class="erp-doc__label">Name</label>
      <input id="cur-name" type="text" formControlName="name" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="cur-symbol" class="erp-doc__label">Symbol</label>
      <input id="cur-symbol" type="text" formControlName="symbol" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="cur-dp" class="erp-doc__label">Decimal places</label>
      <input id="cur-dp" type="number" min="0" step="1" formControlName="decimalPlaces" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="cur-desc" class="erp-doc__label">Description</label>
      <textarea id="cur-desc" rows="2" formControlName="description" class="erp-doc__input"></textarea>
    </div>
    <div class="erp-dialog__actions">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button type="button" label="Save" icon="pi pi-check" [loading]="saving()" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
