<div class="erp-doc payment-voucher">
  <form class="erp-doc__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__header">
      <div>
        <h2>
          Payment voucher
          @if (form.get('voucherNumber')?.value) {
            <span class="erp-doc__badge erp-doc__badge--payment">#{{ form.get('voucherNumber')?.value }}</span>
          }
        </h2>
        <p class="erp-doc__subtitle">Capture payments made to suppliers or for expenses.</p>
      </div>
      <div class="erp-doc__field erp-doc__field--date">
        <label for="v-date" class="erp-doc__label">Date</label>
        <p-datepicker
          inputId="v-date"
          formControlName="date"
          placeholder="Select date"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          iconDisplay="input"
          styleClass="w-full"
        />
      </div>
      <input type="hidden" formControlName="time" />
    </div>

    <div class="erp-doc__meta">
      <div class="erp-doc__field erp-doc__field--narrow">
        <label for="v-num" class="erp-doc__label">Voucher number</label>
        <input id="v-num" type="text" class="erp-doc__input" formControlName="voucherNumber" readonly />
      </div>
      <div class="erp-doc__field erp-doc__field--wide">
        <label for="header-ledger" class="erp-doc__label">Payment account (bank/cash)</label>
        <p-select
          inputId="header-ledger"
          formControlName="headerLedgerId"
          [options]="headerLedgerOptions()"
          optionLabel="label"
          optionValue="value"
          placeholder="Select ledger"
          [filter]="true"
          filterBy="label"
          filterPlaceholder="Search ledger..."
          (onFilter)="onHeaderLedgerFilter($event)"
          [showClear]="true"
          appendTo="body"
          scrollHeight="18rem"
          size="small"
          styleClass="w-full"
        />
      </div>
      <div class="erp-doc__total-block">
        <span class="erp-doc__total-label">Total payment</span>
        <span class="erp-doc__total-value">{{ totalAmount() | number: '1.2-2' }}</span>
      </div>
      <div class="erp-doc__save-wrap">
        <p-button
          label="Save voucher"
          icon="pi pi-save"
          [loading]="saving()"
          [disabled]="saving()"
          (onClick)="save()"
        />
      </div>
    </div>

    <app-voucher-entries-table [lines]="lines" />
  </form>

  @if (saveError()) {
    <p class="erp-doc__alert">{{ saveError() }}</p>
  }

  <section class="erp-doc__json" aria-labelledby="json-heading">
    <div class="erp-doc__json-head">
      <h3 id="json-heading">Data (JSON)</h3>
      <p-button label="Copy JSON" icon="pi pi-copy" size="small" [outlined]="true" (onClick)="copyJson()" />
    </div>
    <pre class="erp-doc__json-pre">{{ dataJson() }}</pre>
  </section>
</div>
