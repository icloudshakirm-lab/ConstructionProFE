<p-dialog
  header="Create delivery note from quotation"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-900 dark:bg-red-950/40 dark:text-red-200">
      {{ error() }}
    </p>
  }

  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium">Quotation</label>
      <p-select
        formControlName="quotationId"
        [options]="quotationOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select quotation"
        [appendTo]="'body'"
        styleClass="w-full"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium">DN number (optional)</label>
      <input type="text" formControlName="dnNumber" class="rounded-lg border border-slate-300 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium">Delivery date</label>
      <p-datepicker formControlName="deliveryDate" dateFormat="yy-mm-dd" [showIcon]="true" styleClass="w-full" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="text-sm font-medium">Status</label>
      <p-select formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" [appendTo]="'body'" styleClass="w-full" />
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="onVisibilityChange(false)" />
      <p-button type="button" label="Create" [loading]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
