<div class="p-6 space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Godowns / Warehouses</h1>
      <p class="text-sm text-slate-500">Manage your storage locations and inventory hubs.</p>
    </div>
    <p-button label="Add Godown" icon="pi pi-plus" (click)="showAddDialog()"></p-button>
  </div>

  <div class="bg-white dark:bg-slate-900 shadow rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
    <p-table [value]="godowns()" [loading]="loading()" [rows]="10" [paginator]="true" 
             styleClass="cp-data-grid" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>City</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-g>
        <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
          <td>{{g.name}}</td>
          <td class="text-slate-600 dark:text-slate-300">{{g.address || '—'}}</td>
          <td class="text-slate-600 dark:text-slate-300">
            @if(g.city) {
              <span class="inline-flex items-center gap-1 rounded bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                <i class="pi pi-map-marker text-[10px]" aria-hidden="true"></i>
                {{g.city}}
              </span>
            } @else { — }
          </td>
          <td class="cp-data-grid__num">
            <p-button icon="pi pi-pencil" (click)="showEditDialog(g)" 
                    variant="text" size="small" severity="info"></p-button>
            <p-button icon="pi pi-trash" (click)="delete(g.id)" 
                    variant="text" size="small" severity="danger"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="cp-data-grid__empty">No godowns found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [header]="editingGodown() ? 'Edit Godown' : 'Add Godown'" 
          [(visible)]="displayDialog" [modal]="true" [style]="{width: '450px'}" 
          [draggable]="false" [resizable]="false">
  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 pt-4">
    <div class="flex flex-col gap-2">
      <label for="name" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Name</label>
      <input id="name" pInputText formControlName="name" placeholder="e.g. Central Warehouse" class="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="address" class="text-sm font-semibold text-slate-700 dark:text-slate-300">Address</label>
      <input id="address" pInputText formControlName="address" placeholder="e.g. 123 Storage Lane" class="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="city" class="text-sm font-semibold text-slate-700 dark:text-slate-300">City</label>
      <input id="city" pInputText formControlName="city" placeholder="e.g. New York" class="w-full" />
    </div>

    <div class="flex justify-end gap-3 pt-6 border-t border-slate-100 dark:border-slate-800">
      <p-button label="Cancel" icon="pi pi-times" variant="text" severity="secondary" (click)="displayDialog.set(false)"></p-button>
      <p-button type="submit" [label]="editingGodown() ? 'Update' : 'Save'" icon="pi pi-check" 
              [disabled]="form.invalid"></p-button>
    </div>
  </form>
</p-dialog>
