<div class="erp-doc">
  <app-cost-category-form-dialog
    [visible]="formVisible()"
    (visibleChange)="onFormVisibleChange($event)"
    [costCategoryId]="row()?.id ?? null"
    (saved)="onFormSaved()"
  />

  <div class="erp-doc__header">
    <div>
      <p-button label="Back to list" icon="pi pi-arrow-left" [text]="true" routerLink="/erp/cost-categories" />
    </div>
  </div>

  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="erp-list-page__loading">Loading…</p>
  } @else if (row(); as r) {
    <div class="erp-doc__section">
      <div class="erp-doc__section-head">
        <div>
          <h3>{{ r.name }}</h3>
          <p>{{ r.code }}</p>
        </div>
        <div class="cp-data-grid__row-actions">
          <p-button label="Edit" icon="pi pi-pencil" severity="secondary" [outlined]="true" (onClick)="openEdit()" />
          <p-button label="Delete" icon="pi pi-trash" severity="danger" [outlined]="true" [loading]="deleting()" (onClick)="remove()" />
        </div>
      </div>
      <dl class="erp-dialog__detail-grid">
        <div>
          <dt>Cost center</dt>
          <dd>{{ costCenterLabel() ?? ('#' + r.costCenterId) }}</dd>
        </div>
        <div>
          <dt>Description</dt>
          <dd>{{ r.description || '—' }}</dd>
        </div>
      </dl>
    </div>
  }
</div>
