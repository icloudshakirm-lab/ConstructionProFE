<p-dialog
  [header]="header"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 28rem)' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  <form class="erp-dialog__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__field">
      <label for="ccat-cc" class="erp-doc__label">Cost center</label>
      <p-select
        inputId="ccat-cc"
        formControlName="costCenterId"
        [options]="costCenterOptions()"
        optionLabel="label"
        optionValue="value"
        placeholder="Select cost center"
        appendTo="body"
        [filter]="true"
        filterBy="label"
        [showClear]="false"
        styleClass="w-full"
      />
    </div>
    <div class="erp-doc__field">
      <label for="ccat-code" class="erp-doc__label">Code</label>
      <input id="ccat-code" type="text" formControlName="code" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="ccat-name" class="erp-doc__label">Name</label>
      <input id="ccat-name" type="text" formControlName="name" class="erp-doc__input" />
    </div>
    <div class="erp-doc__field">
      <label for="ccat-desc" class="erp-doc__label">Description</label>
      <textarea id="ccat-desc" rows="3" formControlName="description" class="erp-doc__input"></textarea>
    </div>
    <div class="erp-dialog__actions">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button type="button" label="Save" icon="pi pi-check" [loading]="saving()" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
