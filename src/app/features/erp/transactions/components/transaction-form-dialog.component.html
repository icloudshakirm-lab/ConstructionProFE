<p-dialog
  header="New transaction"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="erp-dialog"
  [style]="{ width: 'min(calc(100vw - 2rem), 44rem)' }"
  [contentStyle]="{ maxHeight: 'min(80vh, 32rem)', overflowY: 'auto' }"
>
  @if (error()) {
    <p class="erp-doc__alert">{{ error() }}</p>
  }

  <form class="erp-dialog__form" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="erp-doc__grid-2">
      <div class="erp-doc__field">
        <label for="txd-v" class="erp-doc__label">Voucher number</label>
        <input id="txd-v" type="text" formControlName="voucherNumber" class="erp-doc__input" />
      </div>
      <div class="erp-doc__field">
        <label for="txd-type" class="erp-doc__label">Type</label>
        <input id="txd-type" type="text" formControlName="type" class="erp-doc__input" />
      </div>
      <div class="erp-doc__field erp-doc__field--wide">
        <label for="txd-date" class="erp-doc__label">Date (optional)</label>
        <input id="txd-date" type="datetime-local" formControlName="date" class="erp-doc__input" />
      </div>
      <div class="erp-doc__field erp-doc__field--wide">
        <label for="txd-desc" class="erp-doc__label">Description</label>
        <textarea id="txd-desc" rows="2" formControlName="description" class="erp-doc__input"></textarea>
      </div>
    </div>

    <div class="erp-doc__section">
      <div class="erp-doc__section-head">
        <h3>Child lines</h3>
        <p-button type="button" label="Add line" icon="pi pi-plus" size="small" [outlined]="true" (onClick)="addLine()" />
      </div>

      @for (line of lines.controls; track $index; let i = $index) {
        <div class="erp-doc__section" [formGroup]="asGroup(line)">
          <div class="erp-doc__section-head">
            <span>Line {{ i + 1 }}</span>
            <p-button
              type="button"
              label="Remove"
              severity="danger"
              [text]="true"
              size="small"
              [disabled]="lines.length <= 1"
              (onClick)="removeLine(i)"
            />
          </div>
          <div class="erp-doc__grid-2">
            <div class="erp-doc__field erp-doc__field--wide">
              <label class="erp-doc__label">Description</label>
              <input type="text" formControlName="description" class="erp-doc__input" />
            </div>
            <div class="erp-doc__field">
              <label class="erp-doc__label">Ledger</label>
              <p-select
                [inputId]="'txd-led-' + i"
                formControlName="ledgerId"
                [options]="ledgerOptions()"
                optionLabel="label"
                optionValue="value"
                placeholder="Select ledger"
                [filter]="true"
                filterBy="label"
                appendTo="body"
                styleClass="w-full"
              />
            </div>
            <div class="erp-doc__field">
              <label class="erp-doc__label">Dr / Cr</label>
              <input type="text" formControlName="ledgerEntryType" class="erp-doc__input" />
            </div>
            <div class="erp-doc__field erp-doc__field--wide">
              <label class="erp-doc__label">Amount</label>
              <input type="number" step="0.01" formControlName="ledgerAmount" class="erp-doc__input erp-doc__input--amount" />
            </div>
          </div>
        </div>
      }
    </div>

    <div class="erp-dialog__actions">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button type="button" label="Create" icon="pi pi-check" [loading]="saving()" [disabled]="saving()" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
