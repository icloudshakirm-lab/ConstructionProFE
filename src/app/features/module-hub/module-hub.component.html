@if (module(); as mod) {
  <div class="module-hub">
    <p-breadcrumb [model]="breadcrumbs()" [home]="{ icon: 'pi pi-home', routerLink: '/dashboard' }" />

    <header class="module-hub__header">
      <span class="module-hub__icon"><i [class]="mod.icon"></i></span>
      <div>
        @if (mod.badge) {
          <p-tag [value]="mod.badge" severity="warn" />
        }
        <h1>{{ mod.title }}</h1>
        <p>{{ mod.description }}</p>
      </div>
    </header>

    <div class="module-hub__grid">
      @for (page of mod.pages; track page.id) {
        <a class="module-hub__card" [routerLink]="[page.id]">
          <p-card>
            <div class="module-hub__card-inner">
              <i [class]="page.icon"></i>
              <div>
                <h3>{{ page.title }}</h3>
                <p>{{ page.description }}</p>
              </div>
              <i class="pi pi-arrow-right module-hub__arrow"></i>
            </div>
          </p-card>
        </a>
      }
    </div>
  </div>
}
