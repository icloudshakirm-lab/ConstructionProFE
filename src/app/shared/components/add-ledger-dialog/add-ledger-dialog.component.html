<p-dialog
  [header]="header"
  [visible]="visible"
  (visibleChange)="onVisibilityChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [style]="{ width: 'min(calc(100vw - 2rem), 26rem)' }"
  styleClass="add-ledger-dialog"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
    <div class="flex flex-col gap-1.5">
      <label [attr.for]="nameInputId" class="text-sm font-medium text-slate-700 dark:text-slate-300"
        >Ledger name</label
      >
      <input
        [id]="nameInputId"
        type="text"
        formControlName="name"
        autocomplete="off"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none focus:border-[var(--p-primary-color)] focus:ring-2 focus:ring-[color-mix(in_srgb,var(--p-primary-color)_35%,transparent)] dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        placeholder="Enter ledger name"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label [attr.for]="groupInputId" class="text-sm font-medium text-slate-700 dark:text-slate-300">Group</label>
      <p-select
        [inputId]="groupInputId"
        formControlName="groupId"
        [options]="groups"
        optionLabel="label"
        optionValue="id"
        placeholder="Search group..."
        [filter]="true"
        filterBy="label,name"
        filterPlaceholder="Type to search..."
        [showClear]="true"
        [appendTo]="'body'"
        size="small"
        styleClass="w-full add-ledger-group-select"
      />
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-200 pt-4 dark:border-slate-700">
      <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" />
      <p-button type="button" label="Add" severity="success" (onClick)="submit()" />
    </div>
  </form>
</p-dialog>
